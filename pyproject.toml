[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-jev-mcp"
version = "0.1.0"
description = "OpenRouter-backed Jev decision gateway and stdio MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "ctmx" }]
keywords = ["mcp", "model-context-protocol", "jev", "typesafe", "openrouter", "ai-agents", "claude-code", "codex"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "httpx==0.28.1",
    "mcp==2.2.0",
    "pydantic==2.13.5",
]

[project.scripts]
openrouter-jev-mcp = "src.server:run"

[tool.setuptools]
packages = ["src"]
